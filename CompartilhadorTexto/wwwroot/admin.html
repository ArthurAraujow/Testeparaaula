<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Editor de Texto do Professor">
    <title>Editor - Compartilhador de Texto</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="page-wrapper">
        <header class="header">
            <div class="header-content">
                <span class="header-title">Compartilhador de Texto</span>
                <div class="header-actions">
                    <button id="theme-toggle" class="theme-toggle" title="Alternar tema">
                        <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                        <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    </button>
                </div>
            </div>
        </header>

        <main class="main">
            <div class="container-lg space-y-6 animate-fade-in">
                <div class="flex items-center justify-between">
                    <h1 class="text-3xl">Editor de Texto</h1>
                    <div class="flex items-center gap-3">
                        <span id="save-status" class="save-status saved">
                            <span class="save-dot"></span>
                            <span>Salvo</span>
                        </span>
                        <button id="logout-btn" class="btn btn-ghost" title="Sair">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                            <span class="hide-mobile">Sair</span>
                        </button>
                    </div>
                </div>

                <textarea id="editor" class="textarea" style="height: 24rem" placeholder="Escreva seu texto aqui..."></textarea>

                <div class="space-y-3">
                    <p class="text-sm text-muted">Link de compartilhamento para os alunos:</p>
                    <div class="share-info space-y-3">
                        <code id="share-url" class="share-url">Carregando endereço...</code>
                        <button id="copy-link-btn" class="btn btn-primary btn-full">
                            <svg id="copy-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                            <svg id="check-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                            <span id="copy-link-text">Copiar Link de Compartilhamento</span>
                        </button>
                    </div>
                    <p class="text-xs text-muted">
                        Clique para copiar o link. Os alunos precisarão desse link para visualizar o texto.
                        Eles <strong>NÃO</strong> terão acesso ao editor.
                    </p>
                </div>
            </div>
        </main>
    </div>

    <div id="toast" class="toast"></div>

    <script src="/js/theme.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
