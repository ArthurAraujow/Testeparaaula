<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login do Professor - Compartilhador de Texto">
    <title>Login - Compartilhador de Texto</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="page-wrapper">
        <header class="header">
            <div class="header-content">
                <span class="header-title">Compartilhador de Texto</span>
                <button id="theme-toggle" class="theme-toggle" title="Alternar tema">
                    <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
            </div>
        </header>

        <main class="main">
            <div class="container-sm space-y-8 animate-fade-in">
                <div class="space-y-3 text-center">
                    <h1 class="text-3xl text-balance">Compartilhador de Texto</h1>
                    <p class="text-muted">Compartilhe textos de forma segura e fácil com os alunos</p>
                </div>

                <div class="card">
                    <h2 class="text-lg text-center mb-6">Fazer Login</h2>
                    <form id="login-form">
                        <div class="form-group">
                            <label for="username" class="label">Usuário</label>
                            <input id="username" type="text" class="input" placeholder="Digite o usuário" autocomplete="username" autofocus>
                        </div>
                        <div class="form-group">
                            <label for="password" class="label">Senha</label>
                            <input id="password" type="password" class="input input-mono" placeholder="Digite a senha" autocomplete="current-password">
                            <p id="error-msg" class="form-error" style="display:none"></p>
                        </div>
                        <button type="submit" class="btn btn-primary btn-full">Entrar</button>
                    </form>
                </div>

                <div class="text-center space-y-2">
                    <p class="text-sm text-muted">Quer apenas visualizar um texto?</p>
                    <p class="text-xs text-muted">Peça o link de compartilhamento para quem criou o texto.</p>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/theme.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
