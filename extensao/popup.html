<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #18181b;
      color: #e4e4e7;
      font-size: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .header-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #52525b;
      transition: all 0.3s;
    }

    .header-dot.active {
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
    }

    .header-dot.testing {
      background: #eab308;
      box-shadow: 0 0 8px rgba(234, 179, 8, 0.5);
    }

    .header h1 {
      font-size: 13px;
      font-weight: 600;
      color: #fafafa;
      letter-spacing: 0.3px;
    }

    label {
      display: block;
      font-size: 11px;
      color: #a1a1aa;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    select, input[type="password"] {
      width: 100%;
      padding: 8px 10px;
      background: #27272a;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: #f4f4f5;
      font-size: 12px;
      outline: none;
      transition: all 0.2s;
    }

    select {
      margin-bottom: 12px;
      cursor: pointer;
    }

    select:focus, input[type="password"]:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    .help-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
    }

    .key-help {
      font-size: 11px;
      color: #3b82f6;
      text-decoration: none;
      transition: color 0.2s;
    }

    .key-help:hover {
      text-decoration: underline;
      color: #60a5fa;
    }

    .free-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      font-weight: 600;
    }

    .btn {
      width: 100%;
      padding: 9px;
      margin-top: 14px;
      background: #2563eb;
      border: none;
      border-radius: 6px;
      color: #ffffff;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      margin-top: 10px;
      font-size: 11px;
      color: #71717a;
      text-align: center;
      min-height: 14px;
      word-break: break-word;
    }

    .status.success {
      color: #22c55e;
    }

    .status.error {
      color: #ef4444;
    }

    .status.testing {
      color: #eab308;
    }

    .shortcut-hint {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.06);
      font-size: 11px;
      color: #71717a;
      text-align: center;
    }

    kbd {
      background: #27272a;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      color: #d4d4d8;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-dot" id="statusDot"></div>
    <h1>Quick Answer</h1>
  </div>

  <label for="provider">IA Provedor</label>
  <select id="provider">
    <option value="groq">⚡ Groq (100% Grátis & Ultra Rápido)</option>
    <option value="gemini">🔵 Google Gemini (100% Grátis)</option>
    <option value="openai">🟢 ChatGPT / OpenAI (Requer Créditos)</option>
    <option value="auto">🪄 Automático (detecta pela chave)</option>
  </select>

  <label for="apiKey" id="keyLabel">API Key</label>
  <input type="password" id="apiKey" placeholder="gsk_..." autocomplete="off" spellcheck="false">
  
  <div class="help-row">
    <a id="helpLink" class="key-help" href="https://console.groq.com/keys" target="_blank" rel="noopener">Criar chave grátis &rarr;</a>
    <span class="free-badge" id="freeBadge">100% GRÁTIS</span>
  </div>

  <button class="btn" id="saveBtn">Salvar e Testar</button>

  <div class="status" id="status"></div>

  <div class="shortcut-hint">
    Copie a pergunta &rarr; aperte <kbd>Alt</kbd> + <kbd>Q</kbd>
  </div>

  <script src="popup.js"></script>
</body>
</html>
